[package]
name = "remsoundlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Accessible Windows client for the RemSound audio protocol (as spoken by remremote-audio)"

[dependencies]
# Everything default except "wx-asserts": a failed wx check pops up a modal "Debug Alert"
# dialog, and some fire on wx's own accessibility code (wxCheckListBox's MSAA GetState doesn't
# bounds-check the child id a screen reader asks about after the list shrinks). Those checks
# already return a safe fallback, so the dialog is all they add.
wxdragon = { version = "0.9.24", default-features = false, features = [
  "wx-printing",
  "wx-tiff",
  "wx-jpeg",
  "wx-tango-icons",
  "wx-extra-image-formats",
  "wx-regex",
  "appindicator",
] }
wasapi = "0.24"
audiopus_sys = { version = "0.2", features = ["static"] }
aes-gcm = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
socket2 = "0.6"
if-addrs = "0.13"
windows-service = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
prismer = { version = "0.1.6", features = ["static"] }
ship-shape = "0.6.0"
wx-utils = { version = "0.5.1", features = ["global-hotkeys"] }
key-chord = "0.2.2"

[profile.dev.package.audiopus_sys]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
minisign-verify = "0.3.0"
