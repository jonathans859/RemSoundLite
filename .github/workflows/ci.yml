name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  # bindgen (wxdragon-sys) needs libclang; the Windows runner ships LLVM here.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # rust-cache keeps wxdragon-sys's compiled wxWidgets (under target/<profile>/build), so a
      # hit skips its build script. It deletes everything else in target/<profile> before saving,
      # wxWidgets' source and CMake folders included, so those can't be cached this way.
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump when the C++ runtime choice changes, so the cached wxWidgets is rebuilt for it.
          key: static-crt
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
